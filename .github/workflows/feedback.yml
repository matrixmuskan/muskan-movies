name: feedback
# Turns a "feedback: <id>" issue into one row in data/feedback.json, then closes it.
# The static site has no token. The viewer's GitHub login is what files the issue.
on:
  issues:
    types: [opened]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: feedback
  cancel-in-progress: false
jobs:
  ensure-label:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure feedback label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create feedback \
            --repo "${{ github.repository }}" \
            --description "Viewer keep, discard, or rating from the picks site" \
            --color 6b7280 \
            --force

  record:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'feedback:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record feedback
        run: python3 tools/record_feedback.py
      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feedback.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Record feedback #${{ github.event.issue.number }}"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "Recorded in data/feedback.json."
      - name: Publish the updated site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
