name: pages
# Deploys the static site (index.html, assets/, data/picks.json, data/feedback.json).
# README, tools/, .github/, and data/taste-profile.json are not served.
# Pages source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site files only
        run: |
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp -a assets _site/
          cp data/picks.json data/feedback.json _site/data/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
