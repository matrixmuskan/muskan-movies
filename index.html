<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111113">
  <meta name="description" content="Weekly movie and show picks for Muskan.">
  <title>Muskan · Weekly picks</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <a class="skip" href="#app">Skip to picks</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./">Muskan</a>
      <p class="tagline">Weekly picks</p>
    </div>
  </header>
  <div class="wrap">
    <p id="notice" class="notice" role="status" hidden></p>
  </div>
  <main id="app" class="wrap">
    <p class="status-line">Loading picks.</p>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Keep, discard, and stars save on this device immediately. Each action also opens a GitHub issue so it can be written back into the repo. A star rating means you have seen it.</p>
    </div>
  </footer>
  <script src="assets/js/app.js"></script>
  <noscript>
    <p class="wrap status-line">JavaScript is required to load the weekly picks.</p>
  </noscript>
</body>
</html>
